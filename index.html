<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rol de Pagos EC</title>
<meta name="description" content="Rol de pagos parametrizable para Ecuador con décimos, horas extras, IESS, renta, liquidaciones y simulador de comprobantes SRI.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230E1B2C'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23F4B03C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scrim"></div>
<aside class="side" id="side">
  <div class="brand"><span class="sun"></span><div><strong>Rol de Pagos</strong><small id="empresaLabel"></small></div></div>
  <nav id="nav" aria-label="Módulos"></nav>
  <p class="foot">Proyecto académico · Emprendimiento y Legislación Laboral</p>
</aside>
<div class="shell">
  <header class="top">
    <button class="icon-btn menu" id="menuBtn" aria-label="Abrir menú"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="period" role="group" aria-label="Periodo">
      <button class="icon-btn" id="perPrev" aria-label="Mes anterior"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="plabel"><button id="perLabel"></button><input type="month" id="perPick" aria-label="Elegir mes"></span>
      <button class="icon-btn" id="perNext" aria-label="Mes siguiente"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema"><svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
  </header>
  <div class="demo" id="demoBar" hidden><span><b>Datos de demostración.</b> Empresa y empleados ficticios para explorar el sistema.</span><button class="lnk" id="demoClear">Empezar de cero</button></div>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<dialog id="cfm" class="small"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<script src="calc.js"></script>
<script src="js/core.js"></script>
<script src="js/v-sri.js"></script>
<script src="js/data.js"></script>
<script src="js/v-nomina.js"></script>
<script src="js/v-liq.js"></script>
<script src="js/v-misc.js"></script>
<script>
  if (window.App.fresh) window.App.seedDemo();
  window.App.mount();
</script>
</body>
</html>
